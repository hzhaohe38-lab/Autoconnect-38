name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请尽量说明使用场景，而不仅是实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 你的需求与场景
      description: 这个功能解决了什么问题？在什么环境下会遇到？
      placeholder: 例如：宿舍使用无线网络，切换 SSID 后需要重新登录。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望程序如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些临时解决办法？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - Windows PowerShell 版本
        - Linux / WSL Shell 版本
        - Go 版本
        - 文档
        - 其他
    validations:
      required: true
